<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reto de 50 clics | Atlas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#12293A', sea: '#1E6C8A', mist: '#EAF1F4', sol: '#F2B705' },
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'sans-serif'],
            sans: ['"Public Sans"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="flex min-h-screen flex-col bg-mist font-sans text-ink antialiased">

  <header id="site-header" class="sticky top-0 z-30 border-b border-ink/10 bg-white/90 backdrop-blur"></header>

  <main class="mx-auto w-full max-w-xl flex-1 px-4 py-12 text-center md:py-20">
    <h1 class="font-display text-4xl font-extrabold md:text-5xl">Reto de 50 clics</h1>
    <p class="mx-auto mt-4 max-w-md text-lg text-ink/80">
      Haz clic en el botón 50 veces. Al final hay un mensaje para ti.
    </p>

    <p class="mt-10 font-display text-8xl font-extrabold tabular-nums" aria-live="off"><span id="clic-conteo">0</span></p>
    <p class="text-ink/70">de 50 clics</p>

    <div id="progreso" role="progressbar" aria-label="Progreso del reto" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0"
         class="mx-auto mt-6 h-3 w-full overflow-hidden rounded-full bg-ink/10">
      <div id="barra" class="h-full w-0 rounded-full bg-sol transition-[width] duration-200"></div>
    </div>

    <button id="click-btn" type="button"
            class="clic-btn mt-10 h-40 w-40 rounded-full bg-sea font-display text-2xl font-semibold text-white shadow-lg hover:bg-ink disabled:cursor-not-allowed disabled:opacity-40">
      Haz clic
    </button>

    <section id="bendicion" role="status" class="reveal mt-12 hidden rounded-2xl bg-white p-8 shadow-sm">
      <h2 class="font-display text-3xl font-extrabold">Gracias por tomarte tu tiempo</h2>
      <p class="mt-3 text-xl">Que Dios te bendiga a ti y a tu familia.</p>
      <button id="reiniciar" type="button" class="mt-6 rounded-lg bg-ink px-5 py-2.5 font-semibold text-white hover:bg-sea">Volver a empezar</button>
    </section>
  </main>

  <footer id="site-footer" class="bg-ink py-6 text-center text-sm text-white/80"></footer>
  <div id="alerts" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[min(90vw,22rem)] flex-col gap-2"></div>

  <script type="module" src="reto.js"></script>
</body>
</html>
